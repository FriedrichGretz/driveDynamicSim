<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AEB-Lehrsimulation</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                background: #0b1020;
                color: #e6e9f2;
                font:
                    14px system-ui,
                    sans-serif;
            }
            main {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
                min-width: 0;
            }
            canvas {
                border-radius: 12px;
                display: block;
                width: 100%;
            }
            #scene {
                height: 96px;
            }
            #plots {
                height: 390px; /* 2 Reihen à 190 px + Abstand */
            }
            #ui {
                background: #10172b;
                border-radius: 12px;
                padding: 10px 14px;
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 4px;
            }
            .bar h1 {
                font-size: 16px;
                margin: 0 12px 0 0;
            }
            details {
                margin-top: 8px;
            }
            summary {
                cursor: pointer;
                color: #9aa4c2;
                user-select: none;
            }
            .sliders {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 0 16px;
            }
            label {
                display: block;
                margin: 10px 0 2px;
                font-size: 12px;
                color: #9aa4c2;
            }
            input[type="range"] {
                width: 100%;
            }
            button,
            select {
                background: #1d2845;
                color: inherit;
                border: 0;
                border-radius: 8px;
                padding: 7px 12px;
                margin: 2px;
                cursor: pointer;
            }
            #status {
                background: #10172b;
                border-radius: 12px;
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                font: 14px ui-monospace, monospace;
            }
            #status .row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px 16px;
            }
            #badge {
                padding: 6px 14px;
                border-radius: 10px;
                font: bold 15px system-ui, sans-serif;
                color: #0b1020;
            }
            #metrics {
                white-space: pre;
            }
            #crash,
            #ghost {
                min-height: 1.3em;
            }
        </style>
    </head>
    <body>
        <main>
            <div id="ui"></div>
            <div id="status">
                <div class="row">
                    <span id="badge"></span><span id="metrics"></span>
                </div>
                <div id="crash"></div>
                <div id="ghost"></div>
            </div>
            <canvas id="scene"></canvas>
            <canvas id="plots"></canvas>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
