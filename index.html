<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <title>AEB-Lehrsimulation</title>
        <style>
            :root {
                color-scheme: dark;
            }
            body {
                margin: 0;
                background: #0b1020;
                color: #e6e9f2;
                font:
                    14px system-ui,
                    sans-serif;
                display: flex;
                height: 100vh;
            }
            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 12px;
                min-width: 0;
            }
            canvas {
                border-radius: 12px;
                display: block;
            }
            #scene {
                width: 100%;
                height: 300px;
                flex: none;
            }
            #plotwrap {
                flex: 1;
                min-height: 300px;
                position: relative;
            }
            #plots {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
            aside {
                width: 270px;
                padding: 14px;
                background: #10172b;
                overflow: auto;
            }
            label {
                display: block;
                margin: 10px 0 2px;
                font-size: 12px;
                color: #9aa4c2;
            }
            input[type="range"] {
                width: 100%;
            }
            button,
            select {
                background: #1d2845;
                color: inherit;
                border: 0;
                border-radius: 8px;
                padding: 7px 12px;
                margin: 2px;
                cursor: pointer;
            }
            h1 {
                font-size: 16px;
                margin: 0 0 8px;
            }
        </style>
    </head>
    <body>
        <main>
            <canvas id="scene"></canvas>
            <div id="plotwrap"><canvas id="plots"></canvas></div>
        </main>
        <aside id="ui"></aside>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
